<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Tester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Замер скорости интернета</h1>
    <form id="form">
      <label>Адрес файла
        <input id="url" type="text" value="test-5mb.bin" required>
      </label>
      <label>Запросов
        <input id="count" type="number" min="1" max="50" value="10">
      </label>
      <button id="start" type="submit">Старт</button>
    </form>
    <p class="hint">Внешний адрес должен разрешать CORS. По умолчанию - файл 5 МБ с этого же сервера.</p>

    <section id="result" class="result" hidden>
      <div class="stat"><span id="speed">-</span><small>МБ/с</small></div>
      <div class="stat"><span id="avg">-</span><small>сред. время, с</small></div>
      <div class="stat"><span id="total">-</span><small>скачано, МБ</small></div>
    </section>

    <ol id="log"></ol>
  </main>
  <script src="app.js"></script>
</body>
</html>
