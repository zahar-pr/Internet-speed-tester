<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speed Tester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Замер скорости интернета</h1>
    <form id="form">
      <div class="field wide">Готовый файл
        <div class="dropdown" id="dropdown">
          <button type="button" class="dropdown-toggle" id="dropdown-toggle" aria-haspopup="listbox" aria-expanded="false"></button>
          <ul class="dropdown-menu" id="dropdown-menu" role="listbox" hidden></ul>
        </div>
      </div>
      <label class="wide">Адрес файла
        <input id="url" type="text" value="test-5mb.bin" required>
      </label>
      <label>Запросов
        <input id="count" type="number" min="1" max="50" value="10">
      </label>
      <button id="start" type="submit">Старт</button>
    </form>

    <ol id="log"></ol>
  </main>

  <dialog id="popup">
    <h2>Итоги</h2>
    <p id="popup-url" class="url"></p>
    <dl>
      <dt>Скорость</dt><dd><b id="speed">-</b> МБ/с <small id="mbit"></small></dd>
      <dt>Среднее время запроса</dt><dd id="avg">-</dd>
      <dt>Скачано всего</dt><dd id="total">-</dd>
      <dt>Успешных запросов</dt><dd id="ok">-</dd>
    </dl>
    <form method="dialog"><button>Закрыть</button></form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
